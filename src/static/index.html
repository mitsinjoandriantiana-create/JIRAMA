<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102b3f" />
    <title>JIRAMA Invoice Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      rel="stylesheet"
    />
    <link href="/static/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="auth-view" class="auth-shell d-none">
      <section class="auth-form-side">
        <div class="auth-form-wrap">
          <a class="mobile-brand brand" href="/">
            <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span
            ><span>JIRAMA <b>MANAGER</b></span>
          </a>
          <div id="auth-form"></div>
          <p class="auth-disclaimer">
            Suivi personnel indépendant. Factures et paiements saisis
            manuellement.
          </p>
        </div>
      </section>
    </div>

    <div id="app-shell" class="app-shell d-none">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#dashboard"
          ><span class="brand-mark"><i class="fa-solid fa-bolt"></i></span
          ><span>JIRAMA <b>MANAGER</b></span></a
        >
        <div class="workspace-label">ESPACE PERSONNEL</div>
        <nav class="side-nav" aria-label="Navigation principale">
          <a href="#dashboard" data-page="dashboard"
            ><i class="fa-solid fa-chart-pie"></i><span>Vue d'ensemble</span></a
          >
          <a href="#meters" data-page="meters"
            ><i class="fa-solid fa-gauge-high"></i><span>Compteurs</span></a
          >
          <a href="#invoices" data-page="invoices"
            ><i class="fa-regular fa-file-lines"></i><span>Factures</span
            ><span id="overdue-badge" class="nav-badge d-none">0</span></a
          >
          <a href="#payments" data-page="payments"
            ><i class="fa-regular fa-credit-card"></i><span>Paiements</span></a
          >
          <a href="#consumption" data-page="consumption"
            ><i class="fa-solid fa-chart-column"></i
            ><span>Consommation</span></a
          >
          <a href="#notifications" data-page="notifications"
            ><i class="fa-regular fa-bell"></i><span>Notifications</span
            ><span id="notification-badge" class="nav-badge d-none">0</span></a
          >
        </nav>
        <div class="sidebar-bottom">
          <div class="independent-note">
            <i class="fa-solid fa-circle-info"></i
            ><span>Suivi personnel<br />non affilié à la JIRAMA</span>
          </div>
          <button id="logout-button" class="side-logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Déconnexion
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button
            class="icon-button menu-button"
            id="menu-button"
            aria-label="Ouvrir le menu"
          >
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="breadcrumb-label" id="breadcrumb-label">
            Vue d'ensemble
          </div>
          <div class="topbar-actions">
            <button
              class="icon-button notification-button"
              data-go="notifications"
              aria-label="Notifications"
            >
              <i class="fa-regular fa-bell"></i
              ><span
                id="top-notification-dot"
                class="notification-dot d-none"
              ></span></button
            ><button class="user-chip" data-go="profile">
              <span class="avatar" id="user-avatar">U</span
              ><span id="user-name">Utilisateur</span
              ><i class="fa-solid fa-chevron-down"></i>
            </button>
          </div>
        </header>
        <div class="content-area">
          <div id="toast-area" aria-live="polite"></div>
          <div id="page-content"></div>
        </div>
      </main>
    </div>

    <div class="modal fade" id="form-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <div class="eyebrow">GESTION</div>
              <h2 class="modal-title" id="modal-title">Ajouter</h2>
            </div>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fermer"
            ></button>
          </div>
          <div class="modal-body"><form id="entity-form"></form></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
