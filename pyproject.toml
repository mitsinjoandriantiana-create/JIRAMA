[project]
name = "jirama-invoice-manager"
version = "0.1.0"
description = "Application indépendante de suivi personnel des factures JIRAMA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "email-validator>=2.2,<3.0",
    "fastapi[standard]>=0.115,<1.0",
    "jinja2>=3.1,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pyjwt>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]